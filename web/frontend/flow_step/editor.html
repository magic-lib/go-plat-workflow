<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作流编辑器</title>
  <script src="https://cdn.jsdelivery.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; background: #f5f5f5; color: #1a1a1a; height: 100vh; overflow: hidden; }
    /* 顶栏 */
    .topbar { height: 48px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 0; padding: 0 18px; justify-content: space-between; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid #e0e0e0; border-radius: 6px; background: none; cursor: pointer; font-size: 12px; color: #666; transition: all .15s; }
    .back-btn:hover { background: #f5f5f5; color: #185FA5; border-color: #B5D4F4; }
    .topbar-center { display: flex; align-items: center; gap: 8px; position: absolute; left: 50%; transform: translateX(-50%); }
    .topbar-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .badge-new { background: #EAF3DE; color: #3B6D11; }
    .badge-edit { background: #EBF5FF; color: #185FA5; }
    .topbar-id-input { font-size: 12px; padding: 3px 8px; border: 1px solid #e0e0e0; border-radius: 6px; width: 160px; color: #444; font-family: 'Fira Code', monospace; }
    .topbar-id-input:focus { outline: none; border-color: #378ADD; }
    .topbar-name-input { font-size: 14px; font-weight: 500; padding: 3px 10px; border: 1px solid #e0e0e0; border-radius: 6px; width: 200px; color: #1a1a1a; }
    .topbar-name-input:focus { outline: none; border-color: #378ADD; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 500; transition: all .15s; border: none; }
    .btn-ghost { background: none; border: 1px solid #ddd; color: #555; }
    .btn-ghost:hover { border-color: #888; color: #333; }
    .btn-primary { background: #185FA5; color: #fff; }
    .btn-primary:hover { background: #1472c4; }
    /* 主布局 */
    .layout { display: grid; grid-template-columns: 1fr 420px; height: calc(100vh - 48px); }
    /* 左侧编辑区 */
    .editor { display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e5e5e5; overflow: hidden; }
    .tabs { display: flex; border-bottom: 1px solid #e5e5e5; background: #fafafa; }
    .tab { padding: 9px 16px; cursor: pointer; font-size: 12px; color: #666; border-bottom: 2px solid transparent; user-select: none; }
    .tab.active { color: #185FA5; border-bottom-color: #185FA5; background: #fff; font-weight: 500; }
    .tab:hover:not(.active) { color: #333; background: #f0f0f0; }
    .editor-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
    /* 表单卡片 */
    .item-card { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
    .item-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .item-index { font-size: 11px; font-weight: 500; color: #888; background: #eee; padding: 2px 8px; border-radius: 10px; }
    .del-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; transition: color .15s; }
    .del-btn:hover { color: #E24B4A; }
    .form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .form-row:last-child { margin-bottom: 0; }
    .form-label { font-size: 12px; color: #666; min-width: 72px; flex-shrink: 0; }
    .form-input, .form-select { flex: 1; font-size: 12px; padding: 5px 9px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #1a1a1a; font-family: inherit; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #378ADD; }
    .form-checkbox { width: 14px; height: 14px; cursor: pointer; }
    .add-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 8px; border: 1px dashed #ccc; border-radius: 8px; background: none; color: #888; cursor: pointer; font-size: 12px; transition: all .15s; }
    .add-btn:hover { border-color: #378ADD; color: #185FA5; background: #f0f7ff; }
    /* 依赖标签 */
    .dep-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .dep-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 10px; background: #EBF5FF; border-radius: 12px; font-size: 11px; color: #185FA5; border: 1px solid #B5D4F4; }
    .dep-tag button { background: none; border: none; cursor: pointer; color: #185FA5; font-size: 13px; line-height: 1; padding: 0; }
    .dep-tag button:hover { color: #E24B4A; }
    .dep-add { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    /* Strategy 块 */
    .strategy-box { background: #f0f7ff; border: 1px solid #B5D4F4; border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
    .strategy-box-title { font-size: 11px; font-weight: 500; color: #185FA5; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .strategy-item { background: #fff; border: 1px solid #d0e3f7; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
    .strategy-item:last-child { margin-bottom: 0; }
    .strategy-collapsed { cursor: grab; display: flex; align-items: center; gap: 8px; }
    .strategy-collapsed:active { cursor: grabbing; }
    .strategy-collapsed.dragging { opacity: .5; }
    .strategy-collapsed.drag-over { border-color: #185FA5; background: #f0f7ff; }
    .strategy-summary-id { font-size: 12px; font-weight: 500; color: #185FA5; }
    .strategy-summary-info { font-size: 10px; color: #888; margin-left: auto; }
    /* Arguments 块 */
    .arg-block { border: 1px dashed #e0e0e0; border-radius: 6px; padding: 8px 10px; margin-top: 4px; background: #fff; }
    .arg-row { display: flex; align-items: center; gap: 6px; }
    /* Policy */
    .policy-select { font-size: 11px; padding: 3px 6px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #1a1a1a; font-family: inherit; min-width: 90px; }
    .policy-select:focus { outline: none; border-color: #378ADD; }
    /* 杂项 */
    .section-title { font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
    .sub-label { font-size: 11px; color: #aaa; margin: 6px 0 4px; }
    .divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
    .empty-tip { text-align: center; padding: 24px; color: #bbb; font-size: 12px; }
    .resp-hint { font-size: 11px; color: #aaa; margin-top: 8px; }
    /* mini-btn */
    .mini-btn { padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #666; }
    .mini-btn:hover { background: #f0f0f0; }
    .mini-btn:disabled { opacity: .4; cursor: not-allowed; }
    /* 步骤排序按钮 */
    .sort-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 4px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; transition: all .15s; user-select: none; }
    .sort-btn:hover:not(:disabled) { background: #f0f7ff; border-color: #B5D4F4; color: #185FA5; }
    .sort-btn:disabled { opacity: .3; cursor: not-allowed; }
    /* 步骤折叠状态 */
    .step-collapsed { cursor: grab; }
    .step-collapsed:active { cursor: grabbing; }
    .step-collapsed.drag-over { border-color: #185FA5; background: #f0f7ff; }
    .step-collapsed.dragging { opacity: .5; }
    .step-summary { display: flex; align-items: center; gap: 10px; width: 100%; }
    .step-summary-name { font-size: 13px; font-weight: 500; color: #1a1a1a; }
    .step-summary-id { font-size: 11px; color: #888; font-family: 'Fira Code', monospace; }
    .step-summary-info { font-size: 11px; color: #aaa; margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .step-summary-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
    .badge-cond { background: #fff3e0; color: #ba7517; }
    .badge-dep { background: #EBF5FF; color: #185FA5; }
    .badge-exit { background: #fce4ec; color: #993556; }
    .expand-btn { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #666; transition: all .15s; }
    .expand-btn:hover { border-color: #378ADD; color: #185FA5; }
    .step-drag-handle { color: #ccc; font-size: 14px; cursor: grab; user-select: none; line-height: 1; }
    .step-drag-handle:active { cursor: grabbing; }
    /* 右侧 YAML 预览 */
    .preview { display: flex; flex-direction: column; background: #1e1e2e; }
    .preview-header { padding: 10px 16px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; }
    .preview-title { font-size: 12px; font-weight: 500; color: #ccc; }
    .preview-tab-wrap { display: flex; gap: 4px; }
    .preview-tab { padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; color: #888; border: 1px solid transparent; }
    .preview-tab.active { background: #333; color: #fff; border-color: #555; }
    .yaml-content { flex: 1; overflow-y: auto; padding: 14px 16px; font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px; line-height: 1.8; color: #cdd6f4; white-space: pre; }
    .json-content { flex: 1; overflow-y: auto; padding: 14px 16px; font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; line-height: 1.7; color: #cdd6f4; white-space: pre; }
    .yaml-key { color: #89b4fa; } .yaml-str { color: #a6e3a1; } .yaml-num { color: #fab387; } .yaml-bool { color: #f38ba8; }
    /* Toast */
    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 9999; }
    .toast.success { background: #1D9E75; color: #fff; }
    .toast.error { background: #E24B4A; color: #fff; }
    .strategy-item.drag-over { border-color: #185FA5; background: #f0f7ff; }
    .strategy-collapsed.drag-over { border-color: #185FA5; background: #f0f7ff; }
    /* 预览滚动修复 */
    .yaml-content, .json-content { min-height: 0; }
    .test-panel { padding: 12px 0; }
    .test-panel .form-label { min-width: 90px; }
    .test-result { margin-top: 12px; background: #1a1a2e; border-radius: 8px; padding: 12px; max-height: 300px; overflow-y: auto; }
    .test-result pre { margin: 0; font-size: 11px; line-height: 1.7; color: #cdd6f4; white-space: pre-wrap; word-break: break-all; }
    .test-loading { display: flex; align-items: center; gap: 8px; color: #888; font-size: 12px; margin-top: 12px; }
    .dot-flash { animation: flash 1s infinite; }
    @keyframes flash { 0%,100%{opacity:0} 50%{opacity:1} }
    .page-loading { position: fixed; inset: 0; background: rgba(255,255,255,.8); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; z-index: 200; }
  </style>
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <button class="back-btn" @click="goBack">← 返回列表</button>
    <div class="topbar-center">
      <span class="topbar-badge" :class="isEdit ? 'badge-edit' : 'badge-new'">{{ isEdit ? '编辑' : '新建' }}</span>
      <input class="topbar-id-input" v-model="wf.workflow_id" placeholder="工作流 ID（如 test_workflow）" />
      <input class="topbar-name-input" v-model="wf.name" placeholder="工作流名称" />
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" @click="copyYaml">复制 YAML</button>
      <button class="btn btn-primary" @click="saveWorkflow">{{ isEdit ? '保存更新' : '保存新建' }}</button>
    </div>
  </div>

  <!-- 主布局 -->
  <div class="layout">

    <!-- 左侧编辑区 -->
    <div class="editor">
      <div class="tabs">
        <div class="tab" :class="{active:tab==='variables'}" @click="tab='variables'">变量 ({{ wf.variables.length }})</div>
        <div class="tab" :class="{active:tab==='activities'}" @click="tab='activities'">Activities ({{ wf.activities.length }})</div>
        <div class="tab" :class="{active:tab==='steps'}" @click="tab='steps'">步骤 ({{ wf.steps.length }})</div>
        <div class="tab" :class="{active:tab==='responses'}" @click="tab='responses'">响应 ({{ wf.responses.length }})</div>
        <div class="tab" :class="{active:tab==='test'}" @click="tab='test'; syncTestVars()">测试</div>
      </div>

      <div class="editor-body">

        <!-- ====== 变量 ====== -->
        <template v-if="tab==='variables'">
          <div class="section-title">全局变量 Variables</div>
          <div class="item-card" v-for="(v, i) in wf.variables" :key="i">
            <div class="item-card-header">
              <span class="item-index"># {{ i+1 }}</span>
              <div style="display:flex;gap:6px;align-items:center">
                <select class="policy-select" v-model="v.policy">
                  <option value="">不设置</option>
                  <option v-for="p in policyOptions" :key="p" :value="p">{{ policyLabel(p) }}</option>
                </select>
                <button class="del-btn" @click="wf.variables.splice(i,1)">×</button>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label">Key</span>
              <input class="form-input" v-model="v.key" placeholder="变量名，如 userId" />
            </div>
            <div class="form-row">
              <span class="form-label">Value</span>
              <input class="form-input" v-model="v.value" placeholder="默认值" />
            </div>
          </div>
          <div v-if="!wf.variables.length" class="empty-tip">暂无变量</div>
          <button class="add-btn" @click="wf.variables.push({key:'',value:'',policy:''})">+ 添加变量</button>
        </template>

        <!-- ====== Activities ====== -->
        <template v-if="tab==='activities'">
          <div class="section-title">公共 Activities 资源</div>
          <div class="item-card" v-for="(a, i) in wf.activities" :key="i">
            <div class="item-card-header">
              <span class="item-index"># {{ i+1 }}</span>
              <button class="del-btn" @click="wf.activities.splice(i,1)">×</button>
            </div>
            <div class="form-row">
              <span class="form-label">ID</span>
              <input class="form-input" v-model="a.id" placeholder="唯一标识，如 commonLog" />
            </div>
            <div class="form-row">
              <span class="form-label">Namespace</span>
              <select class="form-select" v-model="a.namespace" @change="onNamespaceChange(a)">
                <option value="">请选择命名空间</option>
                <option v-for="ns in namespaceOptions" :key="ns" :value="ns">{{ ns }}</option>
                <option value="__custom__">✏️ 自定义输入</option>
              </select>
              <input v-if="a._customNamespace" class="form-input" v-model="a.namespace" placeholder="输入自定义命名空间" style="margin-left:6px;flex:1" />
            </div>
            <div class="form-row">
              <span class="form-label">Activity</span>
              <select class="form-select" v-model="a.activity" :disabled="!a.namespace || a.namespace==='__custom__'" @change="onActivityChange(a)">
                <option value="">请选择活动类型</option>
                <option v-for="ac in getActivityOptions(a.namespace)" :key="ac" :value="ac">{{ ac }}</option>
                <option value="__custom__">✏️ 自定义输入</option>
              </select>
              <input v-if="a._customActivity" class="form-input" v-model="a.activity" placeholder="输入自定义活动类型" style="margin-left:6px;flex:1" />
            </div>
            <div class="form-row">
              <span class="form-label">Arg Template</span>
              <input class="form-input" v-model="a.arg_template" placeholder="如 {{variables.orderId}}" />
            </div>
            <div class="sub-label">Arguments（key / value / policy）</div>
            <div v-for="(arg, j) in a.arguments" :key="j" class="arg-block" style="margin-bottom:4px">
              <div class="arg-row">
                <input class="form-input" v-model="arg.key" placeholder="key" style="max-width:110px" />
                <span style="color:#bbb;font-size:12px">:</span>
                <input class="form-input" v-model="arg.value" placeholder="value" style="flex:1" />
                <select class="policy-select" v-model="arg.policy">
                  <option value="">不设置</option>
                  <option v-for="p in policyOptions" :key="p" :value="p">{{ policyLabel(p) }}</option>
                </select>
                <button class="del-btn" @click="a.arguments.splice(j,1)">×</button>
              </div>
            </div>
            <button class="add-btn" style="margin-top:4px" @click="a.arguments.push({key:'',value:'',policy:''})">+ 添加参数</button>
            <hr class="divider" />
            <div class="form-row">
              <span class="form-label">ctx_cacheable</span>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#555;cursor:pointer">
                <input type="checkbox" class="form-checkbox" v-model="a.ctx_cacheable" /> 启用
              </label>
            </div>
          </div>
          <div v-if="!wf.activities.length" class="empty-tip">暂无 Activity</div>
          <button class="add-btn" @click="addActivity">+ 添加 Activity</button>
        </template>

        <!-- ====== Steps ====== -->
        <template v-if="tab==='steps'">
          <div class="section-title">工作流步骤</div>
          <div class="item-card"
               v-for="(s, i) in wf.steps"
               :key="i"
               :class="{ 'step-collapsed': !s._expanded, dragging: dragIdx===i }"
               :draggable="!s._expanded"
               @dragstart="onDragStart($event, i)"
               @dragover.prevent="onDragOver($event, i)"
               @dragleave="onDragLeave($event, i)"
               @drop="onDrop($event, i)"
               @dragend="onDragEnd">

            <!-- 折叠状态：一行摘要 -->
            <div v-if="!s._expanded" class="item-card-header" style="margin-bottom:0">
              <div class="step-summary">
                <span class="step-drag-handle" @mousedown.stop>⠿</span>
                <span class="step-summary-name">{{ s.name || '未命名步骤' }}</span>
                <span class="step-summary-id">({{ s.id || `step${i+1}` }})</span>
                <span class="step-summary-info">
                  <span class="step-summary-badge badge-cond" v-if="s.condition && s.condition!=='true'">条件</span>
                  <span class="step-summary-badge badge-dep" v-if="s.depends_on && s.depends_on.length">{{ s.depends_on.length }} 依赖</span>
                  <span class="step-summary-badge badge-exit" v-if="s.on_exit">{{ s.on_exit }}</span>
                  <span style="color:#bbb">#{{ i+1 }}</span>
                </span>
                <button class="expand-btn" @click="s._expanded=true" style="flex-shrink:0">展开 ▸</button>
              </div>
            </div>

            <!-- 展开状态：完整编辑表单 -->
            <template v-else>
            <div class="item-card-header">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="step-drag-handle" @mousedown.stop>⠿</span>
                <span class="item-index" style="color:#185FA5;background:#EBF5FF"># {{ i+1 }}</span>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="sort-btn" :disabled="i===0" @click="moveStep(i,-1)" title="上移">↑</button>
                <button class="sort-btn" :disabled="i===wf.steps.length-1" @click="moveStep(i,1)" title="下移">↓</button>
                <button class="expand-btn" @click="s._expanded=false" title="折叠">▾ 收起</button>
                <button class="del-btn" @click="wf.steps.splice(i,1)" style="margin-left:2px">×</button>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label">ID</span>
              <input class="form-input" v-model="s.id" placeholder="如 step1" />
            </div>
            <div class="form-row">
              <span class="form-label">名称</span>
              <input class="form-input" v-model="s.name" placeholder="步骤描述" />
            </div>
            <div class="form-row">
              <span class="form-label">Condition</span>
              <input class="form-input" v-model="s.condition" placeholder="如 true 或 [step1.responses]" />
            </div>
            <div class="form-row" style="align-items:flex-start">
              <span class="form-label" style="padding-top:4px">Depends On</span>
              <div style="flex:1">
                <div class="dep-wrap">
                  <span class="dep-tag" v-for="(d,di) in s.depends_on" :key="di">
                    {{ d.id }}
                    <button @click="s.depends_on.splice(di,1)">×</button>
                  </span>
                </div>
                <div class="dep-add" v-if="activityIds.length">
                  <select class="form-select" v-model="s._depInput" style="font-size:12px">
                    <option value="">选择依赖的 Activity...</option>
                    <option v-for="aid in activityIds" :key="aid" :value="aid">{{ aid }}</option>
                  </select>
                  <button class="mini-btn" @click="addDepend(s)" :disabled="!s._depInput">添加</button>
                </div>
                <div v-else style="font-size:11px;color:#aaa;margin-top:4px">先在 Activities 标签页添加资源</div>
              </div>
            </div>
            <div class="form-row">
              <span class="form-label">on_exit</span>
              <select class="form-select" v-model="s.on_exit">
                <option value="">（不设置）</option>
                <option value="exit">exit - 正确执行完退出</option>
                <option value="continue">continue - 继续下一步</option>
                <option value="fail">fail - 失败退出</option>
              </select>
            </div>
            <div class="strategy-box">
              <div class="strategy-box-title">
                <span>Strategy ({{ (s.strategies||[]).length }})</span>
                <button class="mini-btn" @click="s.strategies.push({id:'',arg_template:'',timeout:'',arguments:[],_expanded:false})">+ 添加</button>
              </div>
              <div v-if="!s.strategies || !s.strategies.length" style="font-size:11px;color:#aaa;padding:4px 0">暂无策略</div>
              <div v-for="(st, si) in (s.strategies||[])" :key="si"
                   class="strategy-item"
                   :class="{ 'strategy-collapsed': !st._expanded, dragging: stDragIdx===si && stDragStep===i }"
                   :draggable="!st._expanded"
                   @dragstart.stop="onStDragStart($event, i, si)"
                   @dragover.prevent.stop="onStDragOver($event, i, si)"
                   @dragleave.stop="onStDragLeave($event, i, si)"
                   @drop.stop="onStDrop($event, i, si)"
                   @dragend.stop="onStDragEnd">

                <!-- Strategy 折叠 -->
                <div v-if="!st._expanded" style="display:flex;align-items:center;gap:8px;width:100%">
                  <span class="step-drag-handle" style="font-size:12px">⠿</span>
                  <span class="strategy-summary-id">{{ st.id || '未选 Activity' }}</span>
                  <span class="strategy-summary-info" style="display:flex;gap:6px">
                    <span v-if="st.arg_template" style="color:#aaa">{{ st.arg_template }}</span>
                    <span v-if="st.timeout" style="color:#fab387">{{ st.timeout }}s</span>
                    <span v-if="st.arguments&&st.arguments.length" style="color:#a6e3a1">{{ st.arguments.length }} args</span>
                  </span>
                  <button class="expand-btn" @click="st._expanded=true" style="flex-shrink:0;margin-left:auto">展开 ▸</button>
                </div>

                <!-- Strategy 展开 -->
                <template v-else>
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span class="step-drag-handle" style="font-size:12px">⠿</span>
                    <span style="font-size:11px;font-weight:500;color:#185FA5">Strategy #{{ si+1 }}</span>
                  </div>
                  <div style="display:flex;gap:4px;align-items:center">
                    <button class="sort-btn" :disabled="si===0" @click="moveStrategy(s,si,-1)" title="上移">↑</button>
                    <button class="sort-btn" :disabled="si===(s.strategies||[]).length-1" @click="moveStrategy(s,si,1)" title="下移">↓</button>
                    <button class="expand-btn" @click="st._expanded=false">▾ 收起</button>
                    <button class="del-btn" @click="s.strategies.splice(si,1)" style="margin-left:2px">×</button>
                  </div>
                </div>
                <div class="form-row">
                  <span class="form-label">Activity ID</span>
                  <select class="form-select" v-model="st.id">
                    <option value="">选择 Activity...</option>
                    <option v-for="aid in activityIds" :key="aid" :value="aid">{{ aid }}</option>
                  </select>
                </div>
                <div class="form-row">
                  <span class="form-label">Arg Template</span>
                  <input class="form-input" v-model="st.arg_template" placeholder="如 {{variables.orderId}}" />
                </div>
                <div class="form-row">
                  <span class="form-label">Timeout (s)</span>
                  <input class="form-input" v-model="st.timeout" placeholder="超时秒数" type="number" min="0" />
                </div>
                <div class="sub-label" style="margin-top:6px">Arguments（key / value / policy）</div>
                <div v-for="(arg, j) in (st.arguments||[])" :key="j" class="arg-block" style="margin-bottom:4px">
                  <div class="arg-row">
                    <input class="form-input" v-model="arg.key" placeholder="key" style="max-width:110px" />
                    <span style="color:#bbb;font-size:12px">:</span>
                    <input class="form-input" v-model="arg.value" placeholder="value" style="flex:1" />
                    <select class="policy-select" v-model="arg.policy">
                      <option value="">不设置</option>
                      <option v-for="p in policyOptions" :key="p" :value="p">{{ policyLabel(p) }}</option>
                    </select>
                    <button class="del-btn" @click="st.arguments.splice(j,1)">×</button>
                  </div>
                </div>
                <button class="add-btn" style="margin-top:4px" @click="st.arguments.push({key:'',value:'',policy:''})">+ 添加参数</button>
                </template>
              </div>
            </div>
            </template>
          </div>
          <div v-if="!wf.steps.length" class="empty-tip">暂无步骤</div>
          <button class="add-btn" @click="addStep">+ 添加步骤</button>
        </template>

        <!-- ====== Responses ====== -->
        <template v-if="tab==='responses'">
          <div class="section-title">最终响应 Responses</div>
          <div class="item-card" v-for="(r, i) in wf.responses" :key="i">
            <div class="item-card-header">
              <span class="item-index"># {{ i+1 }}</span>
              <button class="del-btn" @click="wf.responses.splice(i,1)">×</button>
            </div>
            <div class="form-row">
              <span class="form-label">字段名</span>
              <input class="form-input" v-model="r.key" placeholder="如 orderName" />
            </div>
            <div class="form-row">
              <span class="form-label">取值表达式</span>
              <input class="form-input" v-model="r.value" placeholder="如 {{step1.responses}}" />
            </div>
          </div>
          <div v-if="!wf.responses.length" class="empty-tip">暂无响应配置</div>
          <button class="add-btn" @click="wf.responses.push({key:'',value:''})">+ 添加响应字段</button>
          <p class="resp-hint">提示：引用步骤响应 <code v-pre>{{stepId.responses}}</code>，引用变量 <code v-pre>{{variables.key}}</code></p>
        </template>

        <!-- ====== 测试流程 ====== -->
        <template v-if="tab==='test'">
          <div class="section-title">测试流程</div>
          <div class="test-panel">
            <div class="form-row">
              <span class="form-label">工作流</span>
              <span style="font-size:13px;color:#1a1a1a;font-weight:500">{{ wf.name || '(未命名)' }}
                <span style="color:#888;font-size:11px;margin-left:4px">{{ wf.workflow_id }}</span>
              </span>
            </div>
            <!-- 全局变量输入 -->
            <div style="margin-top:14px">
              <div class="sub-label" style="margin-bottom:8px">全局变量（变量当前默认值已预填，可覆盖）</div>
              <div v-if="!wf.variables.length" class="empty-tip" style="margin-bottom:8px">暂无全局变量</div>
              <div v-for="(v, i) in testVarValues" :key="i" class="form-row" style="margin-bottom:6px">
                <span class="form-label" style="color:#185FA5;font-family:'Fira Code',monospace;font-size:12px;min-width:110px">{{ v.key }}</span>
                <input class="form-input" v-model="v.value" :placeholder="'默认: ' + (wf.variables[i] ? wf.variables[i].value : '')" />
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
              <button class="btn btn-primary" @click="runTest" :disabled="isTesting">{{ isTesting ? '执行中...' : '▶ 发起测试' }}</button>
              <button class="btn btn-ghost" @click="clearTestResult">清空结果</button>
            </div>
            <div v-if="isTesting" class="test-loading">
              <span class="dot-flash">●</span><span class="dot-flash" style="animation-delay:.3s">●</span><span class="dot-flash" style="animation-delay:.6s">●</span>
              &nbsp;正在执行工作流，请稍候...
            </div>
            <div v-if="testResult" class="test-result" style="margin-top:12px">
              <div style="font-size:11px;color:#aaa;margin-bottom:6px;display:flex;justify-content:space-between">
                <span>执行结果</span>
                <span :style="testStatus==='success'?'color:#52c41a':'color:#ff4d4f'">{{ testStatus === 'success' ? '✓ 成功' : '✗ 失败' }}</span>
              </div>
              <pre>{{ testResult }}</pre>
            </div>
            <div v-if="testLogs.length" class="test-result" style="margin-top:8px">
              <div style="font-size:11px;color:#aaa;margin-bottom:6px">执行日志</div>
              <pre>{{ testLogs.join('\n') }}</pre>
            </div>
          </div>
        </template>

      </div>
    </div>

    <!-- 右侧预览 -->
    <div class="preview">
      <div class="preview-header">
        <div class="preview-tab-wrap">
          <div class="preview-tab" :class="{active:previewTab==='yaml'}" @click="previewTab='yaml'">YAML</div>
          <div class="preview-tab" :class="{active:previewTab==='json'}" @click="previewTab='json'">JSON</div>
        </div>
        <span class="preview-title" style="font-size:11px;color:#555">实时预览</span>
      </div>
      <div v-if="previewTab==='yaml'" class="yaml-content" v-html="highlightedYaml"></div>
      <div v-if="previewTab==='json'" class="json-content">{{ prettyJson }}</div>
    </div>
  </div>

  <!-- Loading -->
  <div class="page-loading" v-if="pageLoading">加载中...</div>

  <!-- Toast -->
  <div class="toast" :class="toast.type" v-if="toast.show">{{ toast.msg }}</div>
</div>

<script>
const { createApp, ref, computed, reactive, onMounted } = Vue;
const API_BASE = 'http://localhost:8080';

createApp({
  setup() {
    const tab = ref('variables');
    const previewTab = ref('yaml');
    const pageLoading = ref(false);
    const toast = reactive({ show: false, msg: '', type: 'success' });

    // 拖拽状态
    const dragIdx = ref(-1);
    const dragOverIdx = ref(-1);
    // Strategy 内部拖拽状态
    const stDragStep = ref(-1);
    const stDragIdx = ref(-1);
    const stDragOverIdx = ref(-1);
    // Activities 配置（下拉选项）
    const activityConfigs = ref([]);
    // 测试流程
    const testVarValues = ref([]);   // [{key, value}] — 从 wf.variables 同步
    const testResult = ref('');
    const testStatus = ref('');
    const testLogs = ref([]);
    const isTesting = ref(false);

    // 从 URL 参数判断是新建还是编辑
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id'); // 数据库自增 id
    const isEdit = ref(!!editId);

    const policyOptions = ['frontend', 'backend', 'frontend+', 'backend+', 'default'];
    const policyLabelMap = { frontend:'强制前端', backend:'强制后端', 'frontend+':'前端优先', 'backend+':'后端优先', default:'默认' };
    function policyLabel(p) { return policyLabelMap[p] || p; }

    // 工作流数据
    const wf = reactive({
      workflow_id: '',
      name: '',
      variables: [],
      activities: [],
      steps: [],
      responses: []
    });

    const activityIds = computed(() => wf.activities.map(a => a.id).filter(Boolean));

    // ===== 从后端加载（编辑模式）=====
    async function loadWorkflow() {
      if (!editId) return;
      pageLoading.value = true;
      try {
        const resp = await fetch(`${API_BASE}/api/workflows/${editId}`);
        const data = await resp.json();
        if (data.code !== 0) { showToast(data.message || '加载失败', 'error'); return; }
        const item = data.data;
        wf.workflow_id = item.workflow_id || '';
        wf.name = item.name || '';
        // 优先从 json_config 回显，失败则尝试从 yaml_content 解析
        let cfg = null;
        let parseErr = '';
        if (item.json_config) {
          try {
            cfg = JSON.parse(item.json_config);
          } catch (e) {
            parseErr = e.message;
          }
        }
        if (!cfg && item.yaml_content) {
          try {
            cfg = jsyaml.load(item.yaml_content);
          } catch (e) {
            showToast('YAML 解析失败: ' + e.message, 'error');
            return;
          }
        }
        if (!cfg) { showToast('无法解析工作流数据: ' + parseErr, 'error'); return; }
        wf.variables  = (cfg.variables  || []).map(v => ({key:v.key||'', value:String(v.value||''), policy:v.policy||''}));
        wf.activities = (cfg.activities || []).map(a => {
          const ns = a.namespace || '';
          const act = a.activity || '';
          const isCustomNs = ns && !namespaceOptions.value.includes(ns);
          const isCustomAct = act && !getActivityOptions(ns).includes(act);
          return Object.assign({}, a, {
            _depInput:'',
            _customNamespace: isCustomNs,
            _customActivity: isCustomAct,
            arguments:(a.arguments||[]).map(arg=>({key:arg.key||'', value:String(arg.value||''), policy:arg.policy||''}))
          });
        });
        wf.steps      = (cfg.steps      || []).map(s => {
          var strategies = [];
          if (s.strategies) {
            strategies = s.strategies.map(function(st) {
              return Object.assign({}, st, { _expanded: false, arguments: (st.arguments||[]).map(function(arg) { return {key:arg.key||'', value:String(arg.value||''), policy:arg.policy||''}; }) });
            });
          } else if (s.strategy_id) {
            strategies = [{
              id: s.strategy_id, arg_template: s.strategy_arg||'', timeout: s.strategy_timeout||'',
              arguments: (s.strategy_args||[]).map(function(arg) { return {key:arg.key||'', value:String(arg.value||''), policy:arg.policy||''}; }),
              _expanded: false
            }];
          }
          const depInput = '';
          const deps = (s.depends_on||[]).map(d => ({id:d.id||'', _depInput:depInput}));
          return Object.assign({}, s, { _depInput:'', _expanded:false, strategies: strategies, depends_on: deps, strategy_id:undefined, strategy_arg:undefined, strategy_timeout:undefined, strategy_args:undefined });
        });
        wf.responses  = (cfg.responses  || []).map(r => ({key:r.key||'', value:String(r.value||'')}));
      } catch (e) {
        showToast('加载失败: ' + e.message, 'error');
      } finally {
        pageLoading.value = false;
      }
    }

    // ===== YAML 生成 =====
    function generateYaml() {
      const lines = [];
      if (wf.workflow_id) lines.push(`id: ${wf.workflow_id}`);
      lines.push(`name: ${wf.name || '(未命名)'}`);
      lines.push('');

      if (wf.variables.length) {
        lines.push('variables:');
        wf.variables.forEach(v => {
          lines.push(`  - key: ${v.key}`);
          lines.push(`    value: "${v.value}"`);
          if (v.policy) lines.push(`    policy: ${v.policy}`);
        });
        lines.push('');
      }

      if (wf.activities.length) {
        lines.push('activities:');
        wf.activities.forEach(a => {
          lines.push(`  - id: ${a.id}`);
          if (a.namespace) lines.push(`    namespace: ${a.namespace}`);
          lines.push(`    activity: ${a.activity}`);
          if (a.arg_template) lines.push(`    arg_template: "${a.arg_template}"`);
          if (a.arguments && a.arguments.length) {
            lines.push('    arguments:');
            a.arguments.forEach(arg => {
              if (!arg.key) return;
              lines.push(`      - key: ${arg.key}`);
              lines.push(`        value: "${arg.value}"`);
              if (arg.policy) lines.push(`        policy: ${arg.policy}`);
            });
          }
          lines.push('    control:');
          lines.push(`      ctx_cacheable: ${!!a.ctx_cacheable}`);
          lines.push('');
        });
      }

      if (wf.steps.length) {
        lines.push('steps:');
        wf.steps.forEach(s => {
          lines.push(`  - id: ${s.id}`);
          if (s.name) lines.push(`    name: "${s.name}"`);
          if (s.condition) lines.push(`    condition: "${s.condition}"`);
          if (s.depends_on && s.depends_on.length) {
            lines.push('    depends_on:');
            s.depends_on.forEach(d => lines.push(`      - id: ${d.id}`));
          }
          if (s.on_exit) {
            lines.push('    control:');
            lines.push(`      on_exit: "${s.on_exit}"`);
          }
          if (s.strategies && s.strategies.length) {
            lines.push('    strategies:');
            s.strategies.forEach(st => {
              if (!st.id) return;
              lines.push(`      - id: ${st.id}`);
              if (st.arg_template) lines.push(`        arg_template: "${st.arg_template}"`);
              if (st.timeout) {
                lines.push('        control:');
                lines.push(`          timeout: ${st.timeout}`);
              }
              if (st.arguments && st.arguments.length) {
                lines.push('        arguments:');
                st.arguments.forEach(arg => {
                  if (!arg.key) return;
                  lines.push(`          - key: ${arg.key}`);
                  lines.push(`            value: "${arg.value}"`);
                  if (arg.policy) lines.push(`            policy: ${arg.policy}`);
                });
              }
            });
          }
          lines.push('');
        });
      }

      if (wf.responses.length) {
        lines.push('responses:');
        wf.responses.forEach(r => { if (r.key) lines.push(`  ${r.key}: "${r.value}"`); });
      }
      return lines.join('\n');
    }

    // JSON 预览（去掉内部字段）
    const prettyJson = computed(() => {
      const cfg = {
        workflow_id: wf.workflow_id,
        name: wf.name,
        variables: wf.variables,
        activities: wf.activities.map(({ _depInput, ...rest }) => rest),
        steps: wf.steps.map(({ _depInput, ...rest }) => rest),
        responses: wf.responses
      };
      return JSON.stringify(cfg, null, 2);
    });

    // YAML 高亮
    const highlightedYaml = computed(() => {
      const yaml = generateYaml();
      return yaml.split('\n').map(line => {
        return line.replace(/^(\s*)([\w_-]+)(:)/, (m, sp, key, colon) =>
          `${esc(sp)}<span class="yaml-key">${esc(key)}${colon}</span>`
        ).replace(/:\s*"([^"]*)"/, (m, val) =>
          `: <span class="yaml-str">"${esc(val)}"</span>`
        ).replace(/:\s*(\d+\.?\d*)$/, (m, n) =>
          `: <span class="yaml-num">${n}</span>`
        ).replace(/:\s*(true|false)$/, (m, b) =>
          `: <span class="yaml-bool">${b}</span>`
        );
      }).join('\n');
    });

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ===== 表单操作 =====
    function addActivity() {
      wf.activities.push({ id:'', namespace:'', activity:'', arg_template:'', arguments:[], ctx_cacheable:true });
    }
    function addStep() {
      const n = wf.steps.length + 1;
      wf.steps.push({ id:`step${n}`, name:`第${n}步`, condition:'true', depends_on:[], on_exit:'', _depInput:'', strategies:[], _expanded:false });
    }
    function addDepend(s) {
      if (!s._depInput) return;
      if (!s.depends_on.find(d => d.id === s._depInput)) s.depends_on.push({ id: s._depInput });
      s._depInput = '';
    }
    function moveStep(i, dir) {
      const j = i + dir;
      if (j < 0 || j >= wf.steps.length) return;
      const tmp = wf.steps[i];
      wf.steps.splice(i, 1);
      wf.steps.splice(j, 0, tmp);
    }

    // ===== 拖拽排序 =====
    function onDragStart(e, i) {
      dragIdx.value = i;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', i);
    }
    function onDragOver(e, i) {
      if (dragIdx.value === -1 || dragIdx.value === i) return;
      dragOverIdx.value = i;
    }
    function onDragLeave(e, i) {
      if (dragOverIdx.value === i) dragOverIdx.value = -1;
    }
    function onDrop(e, i) {
      const from = dragIdx.value;
      if (from === -1 || from === i) return;
      const item = wf.steps[from];
      wf.steps.splice(from, 1);
      wf.steps.splice(from < i ? i - 1 : i, 0, item);
      dragIdx.value = -1;
      dragOverIdx.value = -1;
    }
    function onDragEnd() {
      dragIdx.value = -1;
      dragOverIdx.value = -1;
    }

    // ===== Strategy 拖拽排序 =====
    function moveStrategy(step, si, dir) {
      const arr = step.strategies;
      const j = si + dir;
      if (j < 0 || j >= arr.length) return;
      const tmp = arr[si];
      arr.splice(si, 1);
      arr.splice(j, 0, tmp);
    }
    function onStDragStart(e, stepI, si) {
      stDragStep.value = stepI;
      stDragIdx.value = si;
      e.dataTransfer.effectAllowed = 'move';
    }
    function onStDragOver(e, stepI, si) {
      if (stDragStep.value !== stepI) return;
      if (stDragIdx.value === -1 || stDragIdx.value === si) return;
      stDragOverIdx.value = si;
    }
    function onStDragLeave(e, stepI, si) {
      if (stDragOverIdx.value === si) stDragOverIdx.value = -1;
    }
    function onStDrop(e, stepI, si) {
      const from = stDragIdx.value;
      if (stDragStep.value !== stepI || from === -1 || from === si) return;
      const arr = wf.steps[stepI].strategies;
      const item = arr[from];
      arr.splice(from, 1);
      arr.splice(from < si ? si - 1 : si, 0, item);
      stDragStep.value = -1;
      stDragIdx.value = -1;
    }
    function onStDragEnd() {
      stDragStep.value = -1;
      stDragIdx.value = -1;
      stDragOverIdx.value = -1;
    }

    // ===== Activities 配置下拉 =====
    async function loadActivityConfigs() {
      try {
        const resp = await fetch(`${API_BASE}/api/activities-config`);
        const data = await resp.json();
        if (data.code === 0) activityConfigs.value = data.data || [];
      } catch (_) {}
    }
    const namespaceOptions = computed(() => {
      const set = new Set();
      activityConfigs.value.forEach(c => { if (c.namespace) set.add(c.namespace); });
      return Array.from(set);
    });
    function getActivityOptions(ns) {
      if (!ns || ns === '__custom__') return [];
      return activityConfigs.value.filter(c => c.namespace === ns).map(c => c.activity);
    }
    function onNamespaceChange(a) {
      if (a.namespace === '__custom__') {
        a._customNamespace = true;
        a._customActivity = true;
        a.namespace = '';
        a.activity = '';
      } else {
        a._customNamespace = false;
        a._customActivity = false;
        // 切换 namespace 时清空 activity
        const opts = getActivityOptions(a.namespace);
        if (opts.length && !opts.includes(a.activity)) a.activity = '';
      }
    }
    function onActivityChange(a) {
      if (a.activity === '__custom__') {
        a._customActivity = true;
        a.activity = '';
      } else {
        a._customActivity = false;
      }
    }

    // ===== 测试流程 =====
    // 当切换到测试 tab 时，同步变量列表
    function syncTestVars() {
      const existing = {};
      testVarValues.value.forEach(v => { existing[v.key] = v.value; });
      testVarValues.value = wf.variables
        .filter(v => v.key && !v.key.startsWith('_'))
        .map(v => ({
          key: v.key,
          value: existing[v.key] !== undefined ? existing[v.key] : v.value
        }));
    }

    function clearTestResult() {
      testResult.value = '';
      testLogs.value = [];
      testStatus.value = '';
    }

    async function runTest() {
      if (isTesting.value) return;
      syncTestVars();
      isTesting.value = true;
      testResult.value = '';
      testLogs.value = [];
      testStatus.value = '';
      // 构造变量参数对象
      const variables = {};
      testVarValues.value.forEach(v => { if (v.key) variables[v.key] = v.value; });
      // 当前工作流完整 JSON 配置（与右侧预览一致）
      const jsonConfig = JSON.parse(prettyJson.value);
      try {
        const resp = await fetch(`${API_BASE}/api/test-workflow`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            workflow_id: wf.workflow_id,
            variables: variables,
            json_config: jsonConfig
          })
        });
        const data = await resp.json();
        if (data.code === 0) {
          testStatus.value = 'success';
          testResult.value = JSON.stringify(data.data.result, null, 2);
          testLogs.value = data.data.logs || [];
          showToast('执行成功');
        } else {
          testStatus.value = 'error';
          testResult.value = data.message || '执行失败';
        }
      } catch (e) {
        testStatus.value = 'error';
        testResult.value = '请求失败: ' + e.message;
      } finally {
        isTesting.value = false;
      }
    }

    // ===== 初始化 =====
    onMounted(async () => {
      await loadActivityConfigs();
      await loadWorkflow();
    });

    // ===== Toast =====
    function showToast(msg, type = 'success') {
      toast.msg = msg; toast.type = type; toast.show = true;
      setTimeout(() => { toast.show = false; }, 2500);
    }

    function copyYaml() {
      navigator.clipboard.writeText(generateYaml())
        .then(() => showToast('YAML 已复制'))
        .catch(() => showToast('复制失败', 'error'));
    }

    // ===== 保存（新建 POST / 编辑 PUT）=====
    async function saveWorkflow() {
      if (!wf.name.trim()) { showToast('请填写工作流名称', 'error'); return; }

      const payload = {
        workflow_id:  wf.workflow_id.trim(),
        name:         wf.name.trim(),
        yaml_content: generateYaml(),
        json_config:  prettyJson.value
      };

      try {
        let resp;
        if (isEdit.value) {
          resp = await fetch(`${API_BASE}/api/workflows/${editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          resp = await fetch(`${API_BASE}/api/workflows`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        const data = await resp.json();
        if (data.code === 0) {
          showToast(isEdit.value ? '更新成功！' : '新建成功！');
          if (!isEdit.value && data.data && data.data.id) {
            // 新建成功后跳转到编辑模式，避免重复创建
            setTimeout(() => {
              window.history.replaceState(null, '', `editor.html?id=${data.data.id}`);
              isEdit.value = true;
            }, 600);
          }
        } else {
          showToast(data.message || '保存失败', 'error');
        }
      } catch (e) {
        showToast('连接失败: ' + e.message, 'error');
      }
    }

    function goBack() {
      window.location.href = 'list.html';
    }

    return {
      tab, previewTab, pageLoading, toast, isEdit, wf,
      dragIdx, dragOverIdx, stDragStep, stDragIdx, stDragOverIdx,
      activityIds, highlightedYaml, prettyJson, policyOptions, policyLabel,
      addActivity, addStep, addDepend, moveStep,
      onDragStart, onDragOver, onDragLeave, onDrop, onDragEnd,
      moveStrategy, onStDragStart, onStDragOver, onStDragLeave, onStDrop, onStDragEnd,
      // activities 下拉
      activityConfigs, namespaceOptions, getActivityOptions, onNamespaceChange, onActivityChange,
      // 测试流程
      testVarValues, testResult, testStatus, testLogs, isTesting, syncTestVars, clearTestResult, runTest,
      copyYaml, saveWorkflow, goBack
    };
  }
}).mount('#app');
</script>
</body>
</html>
